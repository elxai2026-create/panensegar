<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Logo Panen Segar">
  <title>Logo Panen Segar</title>
  <desc>Logo orisinal: daun segar, matahari terbit, dan butir panen. Dibuat khusus untuk proyek ini tanpa aset berlisensi pihak ketiga.</desc>
  <defs>
    <linearGradient id="ps-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F9E44"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="ps-leaf" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="ps-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C445"/>
      <stop offset="100%" stop-color="#E8A33D"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="92" height="92" rx="26" fill="url(#ps-bg)" />

  <!-- matahari terbit di belakang daun -->
  <circle cx="48" cy="52" r="21" fill="url(#ps-sun)" opacity="0.28" />
  <circle cx="48" cy="52" r="13" fill="url(#ps-sun)" opacity="0.55" />

  <!-- daun kanan -->
  <path fill="url(#ps-leaf)" d="M48 71c0-15 8-27 22-30 2 17-7 29-22 30Z" />
  <!-- daun kiri -->
  <path fill="url(#ps-leaf)" opacity="0.82" d="M48 71c0-13-7-23-19-26-2 15 6 25 19 26Z" />

  <!-- batang -->
  <path stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round" fill="none" d="M48 70V44" />

  <!-- hasil panen: tiga butir di bawah -->
  <circle cx="38" cy="79" r="4.2" fill="#FFFFFF" fill-opacity="0.92" />
  <circle cx="48" cy="81.5" r="4.6" fill="#FFFFFF" />
  <circle cx="58" cy="79" r="4.2" fill="#FFFFFF" fill-opacity="0.92" />
</svg>